plugins { id 'com.android.application' }

android {
    namespace 'com.paolofree.lettoreepub'
    compileSdk 36

    defaultConfig {
        applicationId 'com.paolofree.lettoreepub'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '1.11'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def releaseKeystore = System.getenv('KEYSTORE_FILE')
            if (releaseKeystore != null && file(releaseKeystore).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}
