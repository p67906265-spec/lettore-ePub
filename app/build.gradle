plugins { id 'com.android.application' }

def hasReleaseSigning = file('paolo-release.jks').exists() &&
        System.getenv('KEYSTORE_PASSWORD') && System.getenv('KEY_ALIAS') && System.getenv('KEY_PASSWORD')

android {
    namespace 'com.paolofree.lettoreepub'
    compileSdk 36

    defaultConfig {
        applicationId 'com.paolofree.lettoreepub'
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName '1.24'
    }

    signingConfigs {
        release {
            storeFile file('paolo-release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}
