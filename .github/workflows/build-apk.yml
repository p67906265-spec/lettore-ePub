name: Build APK firmato
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepara firma permanente
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > app/paolo-release.jks
            echo "Firma permanente preparata"
          else
            echo "Secrets firma non ancora presenti: verrà usata la firma di prova"
          fi
      - name: Compila APK release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/paolo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk Lettore_ePub_v1.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lettore-ePub-v1.6-APK
          path: Lettore_ePub_v1.6.apk
