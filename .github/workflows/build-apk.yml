name: Build APK senza firma permanente
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compila APK debug installabile
        run: gradle assembleDebug --stacktrace
      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lettore_ePub_v1.14_debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lettore-ePub-v1.14-DEBUG-APK
          path: Lettore_ePub_v1.14_debug.apk
